# m3e-gnome: Material 3 palette rendered by matugen into the Shell, GTK, terminal and icon-colour templates.
# Colours are not computed by matugen: bin/material-palette produces the palette (2025 colour spec, official
# library) and `matugen json` only renders the templates below. Scheme, spec, contrast, fallback colour and terminal
# ANSI colours live in ~/.config/m3e-gnome/matugen/palette.json.
#
# Layout assumed by this file (the installer creates it):
#   ~/.config/m3e-gnome/matugen/        this file and palette.json (the palette scripts pass it to matugen with --config)
#   ~/.config/m3e-gnome/shell/NN-*.css   Shell stylesheet parts (templates, copied from theme/shell/m3e-shell/)
#   ~/.config/m3e-gnome/overrides/       other templates (theme/overrides/)
#   ~/.cache/m3e-gnome/shell/NN-*.css    rendered parts, concatenated into the theme stylesheet
#   ~/.themes/M3E-Shell/gnome-shell/     the theme stylesheet and its assets/ (rendered calendar event dots)

[config]
version_check = false

# --- GTK colours -----------------------------------------------------------------------------------------------
# Colour variables of the Material-Gnome base GTK theme (the theme the M3E GTK overrides sit on).
[templates.gtk3]
input_path  = "~/.themes/Material-Gnome/gtk-3.0/colors-template.css"
output_path = "~/.themes/Material-Gnome/gtk-3.0/colors.css"

[templates.gtk4]
input_path  = "~/.themes/Material-Gnome/gtk-4.0/colors-template.css"
output_path = "~/.themes/Material-Gnome/gtk-4.0/colors.css"

# --- Shell theme (M3E-Shell) ---------------------------------------------------------------------------------
# Calendar "day with events" dots (url("assets/event-dot*.svg") in 30-calendar.css) in palette colours: the stock sheet
# sets a fixed white SVG, invisible in light mode and not dimmed on days outside the month. Written into the theme's
# assets directory before the Shell parts (index 9), so that the stylesheet written by the last part's post_hook
# never points at dots of the previous palette.
[templates.event-dot]
input_path  = "~/.config/m3e-gnome/overrides/event-dot.svg.template"
output_path = "~/.themes/M3E-Shell/gnome-shell/assets/event-dot.svg"
index = 9

[templates.event-dot-dimmed]
input_path  = "~/.config/m3e-gnome/overrides/event-dot-dimmed.svg.template"
output_path = "~/.themes/M3E-Shell/gnome-shell/assets/event-dot-dimmed.svg"
index = 9

[templates.event-dot-today]
input_path  = "~/.config/m3e-gnome/overrides/event-dot-today.svg.template"
output_path = "~/.themes/M3E-Shell/gnome-shell/assets/event-dot-today.svg"
index = 9

# The Shell stylesheet is split by concern into parts. Each part is rendered to its own file (index = cascade order,
# matugen renders in index order) and the post_hook of the LAST part concatenates them, in order, into the theme
# stylesheet. Concatenation instead of @import: St gives @import-ed sheets a lower priority than the main sheet, which
# breaks the cascade. Parts keep each matugen if/else block inside a single file. Add a part: declare it here with
# the next index, before `shell-99-no-bold`, and add it to that part's post_hook list.

[templates.shell-00-base]
input_path  = "~/.config/m3e-gnome/shell/00-base.css"
output_path = "~/.cache/m3e-gnome/shell/00-base.css"
index = 10

[templates.shell-10-top-bar]
