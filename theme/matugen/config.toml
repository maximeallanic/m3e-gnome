# --- Extensions stylesheet ---------------------------------------------------------------------------------------
# Loaded as an EXTENSION stylesheet by the m3e-extensions extension (m3e-extensions@maximeallanic.github.io), which
# reloads it when the file changes. It restyles third-party extensions (Dash to Dock, GSConnect) and sits above the
# theme in the St cascade.
[templates.m3e-extensions]
input_path  = "~/.config/m3e-gnome/m3e-extensions-template.css"
output_path = "~/.config/m3e-gnome/m3e-extensions.css"
index = 60

# --- Optional integrations -----------------------------------------------------------------------------------
[templates.papirus-folders]
# Papirus folder colour = Papirus hue closest to the primary colour (needs papirus-folders; remove if unused)
input_path  = "~/.config/m3e-gnome/overrides/papirus-folders.template"
output_path = "~/.cache/matugen-papirus-folders.txt"
index = 70
colors_to_compare = [
    { name = "blue", color = "#5294e2" },
    { name = "bluegrey", color = "#607d8b" },
    { name = "breeze", color = "#57b8ec" },
    { name = "brown", color = "#ae8e6c" },
    { name = "carmine", color = "#a30002" },
    { name = "cyan", color = "#00bcd4" },
    { name = "darkcyan", color = "#45abb7" },
    { name = "deeporange", color = "#eb6637" },
    { name = "green", color = "#87b158" },
